name: Kontrola hlaseni rozhlasu

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: write

jobs:
  check-radio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python libraries
        run: pip install -r requirements.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run radio script
        run: python radio.py

      - name: Upload MP4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hlaseni-mp4
          path: output/*.mp4
          if-no-files-found: ignore

      - name: Create releases and send to Make
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          if [ ! -f created.json ]; then
            echo "created.json neexistuje."
            exit 0
          fi

          count=$(jq 'length' created.json)

          echo "Pocet novych hlaseni: $count"

          if [ "$count" -eq 0 ]; then
            echo "Zadne nove MP4 k odeslani."
            exit 0
          fi

          i=0

          jq -c '.[]' created.json | while read -r item; do
            i=$((i + 1))

            title=$(echo "$item" | jq -r '.title')
            page_url=$(echo "$item" | jq -r '.page_url')
            mp4_file=$(echo "$item" | jq -r '.mp4_file')

            if [ ! -f "$mp4_file" ]; then
              echo "Soubor neexistuje: $mp4_file"
              continue
            fi

            filename=$(basename "$mp4_file")

            tag="radio-${{ github.run_id }}-${{ github.run_attempt }}-$i"

            echo "Vytvarim release:"
            echo "$tag"
            echo "$filename"

            gh release create "$tag" \
              "$mp4_file#$filename" \
              --title "$title" \
              --notes "$page_url"

            video_url=$(gh release view "$tag" \
              --json assets \
              --jq '.assets[0].url')

            echo "Verejna URL videa:"
            echo "$video_url"

            payload=$(jq -n \
              --arg title "$title" \
              --arg page_url "$page_url" \
              --arg filename "$filename" \
              --arg video_url "$video_url" \
              '{
                title: $title,
                page_url: $page_url,
                filename: $filename,
                video_url: $video_url
              }')

            echo "Posilam do Make..."

            curl --fail-with-body \
              -X POST \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$MAKE_WEBHOOK_URL"

            echo
            echo "Odeslano do Make."
          done

      - name: Save processed state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add processed.json
          git commit -m 'Aktualizace zpracovanych hlaseni' || echo 'Zadne zmeny'
          git push
