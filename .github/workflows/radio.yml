name: Kontrola hlaseni rozhlasu

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-radio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastaveni Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalace knihoven
        run: pip install -r requirements.txt

      - name: Instalace FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Kontrola hlaseni
        run: python radio.py

      - name: Ulozeni stavu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 
"41898282+github-actions[bot]@users.noreply.github.com"
          git add processed.json
          if git diff --cached --quiet; then
            echo "Zadna zmena v processed.json"
          else
            git commit -m "Aktualizace zpracovanych hlaseni"
            git push
          fi

